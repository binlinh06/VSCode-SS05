    <section class="SS06">
        <h3>Center Align Text</h3>
        <p>To just center the text inside an element,use <span class="syntax">text-align:center;</span></p>
        <div class="demo-figure">This text is centered</div>
        <div class="demo-code">
            <h4>Example</h4>
            <div class="code-content">
                <p><span style="color: #a44343;">.center</span> &#123;</p>
                <p>
                    <span style="color: #e24d4e;">text-align</span>:
                    <span style="color: #312dc5;">center</span>;
                </p>
                <p>
                    <span style="color: #e24d4e;">border</span>:
                    <span style="color: #312dc5;">3px solid green</span>;
                </p>
                <p>&#125;</p>
            </div>
